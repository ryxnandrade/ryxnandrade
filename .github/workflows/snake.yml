# Gera a animação da cobrinha comendo o gráfico de contribuições e publica os SVGs na branch "output",
# que o README lê por raw.githubusercontent.com. Roda no próprio repositório ryxnandrade/ryxnandrade.
name: Cobrinha das contribuições

on:
  schedule:
    - cron: "0 3 * * *" # todo dia às 3h UTC (0h em Brasília)
  workflow_dispatch: # permite rodar na mão em Actions > Run workflow
  push:
    branches: [main]

permissions:
  contents: write # necessário para gravar a branch "output"

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Duas versões: clara (padrão) e escura, com as cores da RYXN.
          outputs: |
            dist/github-snake.svg?color_snake=#2855d9&color_dots=#ebedf0,#c6d3f7,#8fa8f5,#4d74e0,#2855d9
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#8fa8f5&color_dots=#161b22,#13254f,#1d3b8f,#2855d9,#8fa8f5

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
